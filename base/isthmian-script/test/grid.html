<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>MarkIsthmianScript Grid</title>
    <style>
      @font-face {
        font-family: 'MarkIsthmianScript';
        src: url('../base/MarkIsthmianScript-Regular.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #fff;
      }

      .section-label {
        font-family: sans-serif;
        font-size: 14px;
        color: #71717a;
        padding: 16px 8px 8px 8px;
        text-align: center;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        line-height: 1;
        width: 840px;
        margin: 0 auto;
      }

      .grid span {
        display: flex;
        align-items: center;
        justify-content: center;
        aspect-ratio: 1;
        font-size: 52px;
        color: #18181b;
        font-family: 'MarkIsthmianScript', sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="section-label">
      MarkIsthmianScript (Isthmian · Linear B blocks)
    </div>
    <div class="grid" id="grid"></div>
    <script>
      // Isthmian glyphs are mapped sequentially to the Linear B
      // Unicode blocks (U+10000 onward). The font currently covers
      // 185 glyphs, spanning from the Syllabary (U+10000) into the
      // Ideograms block.
      var LINEAR_B_BASE = 0x10000
      var COUNT = 185
      var parts = []
      for (var i = 0; i < COUNT; i++) {
        var cp = LINEAR_B_BASE + i
        var ch = String.fromCodePoint(cp)
        var hex = cp.toString(16).toUpperCase()
        parts.push('<span title="U+' + hex + '">' + ch + '</span>')
      }
      document.getElementById('grid').innerHTML = parts.join('')
    </script>
  </body>
</html>
