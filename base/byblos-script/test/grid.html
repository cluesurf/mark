<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>MarkByblosScript Grid</title>
    <style>
      @font-face {
        font-family: 'MarkByblosScript';
        src: url('../base/MarkByblosScript-Regular.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #fff;
      }

      .section-label {
        font-family: sans-serif;
        font-size: 14px;
        color: #71717a;
        padding: 16px 8px 8px 8px;
        text-align: center;
      }

      .grid {
        display: flex;
        flex-wrap: wrap;
        line-height: 1;
        width: 840px;
        margin: 0 auto;
      }

      .grid span {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        font-size: 36px;
        color: #18181b;
        font-family: 'MarkByblosScript', sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="section-label">
      MarkByblosScript (Byblos syllabary · Egyptian Hieroglyphs block)
    </div>
    <div class="grid" id="grid"></div>
    <script>
      // Byblos glyphs are mapped sequentially to the
      // Egyptian Hieroglyphs Unicode block (U+13000 onward).
      // The font currently covers 114 glyphs starting at
      // U+13000.
      var EGYPTIAN_BASE = 0x13000
      var COUNT = 114
      var parts = []
      for (var i = 0; i < COUNT; i++) {
        var cp = EGYPTIAN_BASE + i
        var ch = String.fromCodePoint(cp)
        var hex = cp.toString(16).toUpperCase()
        parts.push('<span title="U+' + hex + '">' + ch + '</span>')
      }
      document.getElementById('grid').innerHTML = parts.join('')
    </script>
  </body>
</html>
