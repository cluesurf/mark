<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>MarkProtoElamite Grid</title>
    <style>
      @font-face {
        font-family: 'MarkProtoElamite';
        src: url('../base/MarkProtoElamite-Regular.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #fff;
      }

      .section-label {
        font-family: sans-serif;
        font-size: 14px;
        color: #71717a;
        padding: 16px 8px 8px 8px;
        text-align: center;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(14, 1fr);
        width: 864px;
        margin: 0 auto;
      }

      .grid span {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 58px;
        min-width: 0;
        overflow: hidden;
        line-height: 1;
        font-size: 56px;
        color: #18181b;
        font-family: 'MarkProtoElamite', sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="section-label">
      MarkProtoElamite (Proto-Elamite · hosted on KS X 1001 Hangul)
    </div>
    <div
      class="grid"
      id="grid"
    ></div>

        var hex = ch.codePointAt(0).toString(16).toUpperCase()
        parts.push(
          '<span title="U+' + hex + ' (' + ch + ')">' + ch + '</span>',
        )
      })
      document.getElementById('grid').innerHTML = parts.join('')
